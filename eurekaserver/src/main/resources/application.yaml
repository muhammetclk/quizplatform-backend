server:
  port: 8761

spring:
  application:
    name: eurekaserver

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false # kendini kaydetmesin
    fetch-registry: false # registry'yi fetch etmesin
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    wait-time-in-ms-when-sync-empty: 0
    enable-self-preservation: false # dev modda kapatalım
