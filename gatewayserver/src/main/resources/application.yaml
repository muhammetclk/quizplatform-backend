server:
  port: 8080

spring:
  application:
    name: gatewayserver

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            # Auth — public
            - id: auth-public
              uri: lb://authservice
              predicates:
                - Path=/api/auth/register, /api/auth/login

            # Auth — korumalı
            - id: auth-protected
              uri: lb://authservice
              predicates:
                - Path=/api/auth/**
              filters:
                - AuthFilter

            # Quiz Service
            - id: quiz-service
              uri: lb://quizservice
              predicates:
                - Path=/api/category/**, /api/topic/**, /api/quiz/**, /api/attempt/**
              filters:
                - AuthFilter

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
